<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review facts</title>
<style>
  :root {
    --bg: var(--color-background-primary, #ffffff); --fg: var(--color-text-primary, #1c1917);
    --muted: var(--color-text-secondary, #78716c); --line: var(--color-border-primary, #d6d3d1);
    --accent: #2563eb; --ok: #15803d; --warn: #b45309;
    font-family: var(--font-sans, system-ui, sans-serif); color-scheme: light dark;
  }
  :root[data-theme="dark"] { --bg: var(--color-background-primary, #1c1917); --fg: var(--color-text-primary, #f5f5f4);
    --muted: var(--color-text-secondary, #a8a29e); --line: var(--color-border-primary, #44403c); --accent: #60a5fa; --ok: #4ade80; --warn: #fbbf24; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font-size: 14px; line-height: 1.45; }
  h1 { font-size: 15px; margin: 0 0 12px; } .muted { color: var(--muted); }
  article { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  article h2 { font-size: 14px; margin: 0 0 4px; } article p { margin: 0 0 8px; color: var(--muted); }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  button { padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .done-ok { color: var(--ok); } .done-warn { color: var(--warn); }
  footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
</style>
</head>
<body>
  <h1>Review facts <span class="muted" id="count"></span></h1>
  <section id="items"><p class="muted">Loading…</p></section>
  <footer><span class="muted" id="tally"></span><button class="primary" id="finish" hidden>Done</button></footer>
<script>/*BRIDGE*/</script>
<script>
  const $ = (id) => document.getElementById(id);
  const today = new Date().toISOString().slice(0, 10);
  const decisions = [];

  async function decide(item, verdict, actions) {
    actions.querySelectorAll("button").forEach((b) => (b.disabled = true));
    const set = verdict === "confirmed" ? { status: "confirmed", reviewed: today } : { status: "outdated" };
    try {
      if (verdict !== "skipped") {
        await mcpApp.callTool("save", {
          changes: [{ path: item.id, frontmatter: { set } }],
          message: `review: ${verdict} ${item.id} (review app)`,
        });
      }
      actions.innerHTML = `<span class="${verdict === "confirmed" ? "done-ok" : "done-warn"}">${verdict}</span>`;
      decisions.push({ id: item.id, verdict });
      $("tally").textContent = `${decisions.length} decided`;
      $("finish").hidden = false;
    } catch (e) {
      actions.querySelectorAll("button").forEach((b) => (b.disabled = false));
      actions.append(Object.assign(document.createElement("span"), { textContent: ` ${e.message}`, className: "done-warn" }));
    }
  }

  function render(queue) {
    const items = queue?.items || [];
    $("count").textContent = items.length ? `(${items.length} of ${items.length + (queue.remaining || 0)})` : "";
    $("items").innerHTML = items.length ? "" : `<p class="muted">Nothing to review.</p>`;
    for (const item of items) {
      const el = document.createElement("article");
      el.innerHTML = `<h2></h2><p></p><div class="actions"></div>`;
      el.querySelector("h2").textContent = item.title;
      el.querySelector("p").textContent = [item.summary, item.as_of && `as of ${item.as_of}`].filter(Boolean).join(" · ");
      const actions = el.querySelector(".actions");
      for (const [label, verdict, cls] of [["Confirm", "confirmed", "primary"], ["Outdated", "outdated", ""], ["Skip", "skipped", ""]]) {
        const b = Object.assign(document.createElement("button"), { textContent: label, className: cls });
        b.onclick = () => decide(item, verdict, actions);
        actions.append(b);
      }
      if (item.url) {
        const open = Object.assign(document.createElement("button"), { textContent: "Open" });
        open.onclick = () => mcpApp.openLink(item.url);
        actions.append(open);
      }
      $("items").append(el);
    }
  }

  $("finish").onclick = () => {
    const by = (v) => decisions.filter((d) => d.verdict === v).map((d) => d.id);
    mcpApp.message(`I reviewed ${decisions.length} facts. Confirmed: ${by("confirmed").join(", ") || "none"}. ` +
      `Outdated: ${by("outdated").join(", ") || "none"}. Skipped: ${by("skipped").length}. ` +
      "Please log the review and follow up on the outdated ones.");
  };
  mcpApp.on("ui/notifications/tool-result", (result) => render(result.structuredContent));
  mcpApp.start("vault-review");
</script>
</body>
</html>
