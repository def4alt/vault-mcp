# Frontmatter schema for notes/, sources/, projects/ and files/. Checked by the vault server and lint.
categories: [studies, careers, systems, agents, products, research, places,
             experiences, wellness, gear, finances, administration, preferences]

notes:
  required: [kind, summary]
  fields:
    kind:       {enum: [fact, entity, synthesis, evergreen, reference, journal, index]}
    status:     {enum: [unreviewed, confirmed, needs-update, outdated, historical], only_for: [fact]}
    as_of:      {type: date}
    reviewed:   {type: date}
    categories: {type: list, items: category}
    source:     {type: list, items: link, prefix: ["sources/", "files/"]}
    about:      {type: list, items: link}
    related:    {type: list, items: link}
    supersedes: {type: list, items: link}
    projects:   {type: list, items: link, prefix: "projects/"}
    rating:     {type: int, min: 1, max: 7}
    url:        {type: str}
    summary:    {type: str}
    tags:       {type: list}
    aliases:    {type: list}

sources:
  required: [kind, origin, source_kind, as_of, summary]
  fields:
    kind:        {enum: [source]}
    origin:      {enum: [claude, chatgpt, hermes, manual, web]}
    source_kind: {enum: [snapshot, chat-export, clipping, document, web-page]}
    as_of:       {type: date}
    categories:  {type: list, items: category}
    tags:        {type: list}
    summary:     {type: str}
    url:         {type: str}

projects:
  required: [kind, summary]
  fields:
    kind:       {enum: [project]}
    status:     {enum: [active, exploring, paused, done, dropped]}
    area:       {type: str}
    review:     {type: date}
    categories: {type: list, items: category}
    tags:       {type: list}
    summary:    {type: str}

# One note per stored file. The file itself is blobs/<sha256[:16]>.<ext>, never renamed.
files:
  required: [kind, blob, sha256, as_of, summary]
  fields:
    kind:          {enum: [file]}
    blob:          {type: str}
    sha256:        {type: str}
    media:         {enum: [document, video, audio, image, data]}
    mime:          {type: str}
    size:          {type: int, min: 0}
    original_name: {type: str}
    origin:        {enum: [claude, chatgpt, hermes, manual, web]}
    url:           {type: str}
    as_of:         {type: date}
    categories:    {type: list, items: category}
    tags:          {type: list}
    about:         {type: list, items: link}
    related:       {type: list, items: link}
    projects:      {type: list, items: link, prefix: "projects/"}
    summary:       {type: str}
